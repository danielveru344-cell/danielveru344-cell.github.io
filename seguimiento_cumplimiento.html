<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento Mantenimiento · Bussié</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f1f5f9; color: #0D2F5C; }

/* HEADER */
.header { background: #0D2F5C; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; row-gap: 10px; }
.header-title { padding-left: 0; }
.header-title h1 { font-size: 13px; font-weight: 700; }
.header-title small { font-size: 10px; opacity: .5; display: block; margin-top: 1px; }
.header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
.sync-dot.syncing { background: #fbbf24; animation: pulse .8s infinite; }
.sync-dot.error { background: #f87171; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
button { font-family: Arial; font-size: 12px; font-weight: 700; padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; }
.btn-white { background: white; color: #0D2F5C; }
.btn-green { background: #16a34a; color: white; }
.btn-blue  { background: #2d7dd2; color: white; }

/* MONTH TABS (ahora integradas en el mismo header) */
.month-bar { background: transparent; padding: 0; display: flex; align-items: stretch; overflow-x: auto; border-left: 1px solid rgba(255,255,255,.15); margin-left: 4px; padding-left: 14px; flex: 1; min-width: 0; }
.month-tab { padding: 9px 14px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: color .15s; }
.month-tab:hover { color: rgba(255,255,255,.8); }
.month-tab.active { color: white; border-color: #2d7dd2; }
.month-close { font-size: 16px; line-height: 1; opacity: .4; }
.month-close:hover { opacity: 1; color: #f87171; }
.month-pct { font-size: 10px; opacity: .6; }
.month-add { padding: 0 14px; font-size: 20px; color: rgba(255,255,255,.3); cursor: pointer; display: flex; align-items: center; }
.month-add:hover { color: white; }

/* UPLOAD */
.upload-wrap { max-width: 420px; margin: 70px auto; text-align: center; }
.upload-box { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 48px 24px; background: white; cursor: pointer; }
.upload-box:hover { border-color: #2d7dd2; background: #eff6ff; }
.upload-box h2 { font-size: 17px; margin: 12px 0 6px; }
.upload-box p { font-size: 13px; color: #64748b; line-height: 1.6; }

/* LOADING */
.loading { text-align: center; padding: 80px 20px; color: #64748b; }
.loading-spin { font-size: 32px; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* STATS */
.global-bar { background: white; padding: 12px 20px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.gs { text-align: center; }
.gs-n { font-size: 20px; font-weight: 800; }
.gs-l { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
.prog-wrap { flex: 1; max-width: 260px; }
.prog-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 4px; }
.prog-fill { height: 100%; border-radius: 4px; transition: width .4s; }

/* TECH TABS */
.tech-nav { background: white; border-bottom: 1px solid #e2e8f0; padding: 0 16px; display: flex; overflow-x: auto; }
.tech-tab { padding: 10px 13px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: #64748b; white-space: nowrap; }
.tech-tab.active { color: #0D2F5C; border-color: #2d7dd2; }
.badge { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 3px; }
.badge-ok   { background: #dcfce7; color: #16a34a; }
.badge-pend { background: #fef9c3; color: #ca8a04; }

/* TECH PANEL */
.tech-panel { padding: 14px 16px 80px; }
.tech-header { background: white; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border: 1px solid #e2e8f0; }
.th-name { font-size: 16px; font-weight: 800; flex: 1; min-width: 120px; }
.th-stat { text-align: center; }
.th-n { font-size: 18px; font-weight: 800; }
.th-l { font-size: 10px; color: #64748b; }
.th-bar { width: 110px; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
.th-fill { height: 100%; border-radius: 4px; transition: width .3s; }

/* TASKS */
.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; padding: 10px 0 4px; }
.task-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; transition: background .1s; }
.task-row:hover { background: #f8fafc; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #cbd5e1; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.check.on { background: #16a34a; border-color: #16a34a; color: white; }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 13px; font-weight: 600; }
.task-sub  { font-size: 11px; color: #64748b; margin-top: 2px; }
.task-code { font-family: monospace; font-size: 10px; background: #eff6ff; color: #1d4ed8; padding: 1px 5px; border-radius: 3px; }
.task-date { font-family: monospace; font-size: 10px; color: #94a3b8; white-space: nowrap; }
.note-btn { background: none; border: none; padding: 4px 6px; cursor: pointer; font-size: 15px; opacity: .35; border-radius: 5px; flex-shrink: 0; line-height: 1; }
.note-btn:hover { opacity: 1; background: #eff6ff; }
.note-btn.has-note { opacity: .85; }
.note-panel { background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 8px 10px; display: flex; gap: 7px; align-items: flex-start; }
.note-panel textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: Arial; resize: none; min-height: 58px; color: #0D2F5C; background: white; line-height: 1.4; }
.note-panel textarea:focus { outline: none; border-color: #2d7dd2; box-shadow: 0 0 0 2px #bfdbfe; }
.note-save-btn { background: #2d7dd2; color: white; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.note-save-btn:hover { background: #1d6ab8; }
.task-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 5px; overflow: hidden; }
.task-card.done { background: #f0fdf4; border-color: #bbf7d0; }
.task-card.done .task-name { text-decoration: line-through; color: #86efac; }
.task-card.done .task-sub  { color: #86efac; }
.task-note-preview { font-size: 11px; color: #64748b; margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* FOOTER */
.footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; padding: 8px 16px; display: flex; align-items: center; gap: 10px; z-index: 50; }
.footer-info { font-size: 11px; color: #64748b; }
</style>
</head>

const HEADERS = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

async function sbLoad() {
  const r = await fetch(`${SB_URL}/rest/v1/mtto_meses?select=*&order=id`, { headers: HEADERS });
  if (!r.ok) throw new Error('Error cargando datos');
  return r.json();
}
async function sbUpsert(row) {
  // Primero intenta actualizar (PATCH); si no existe, inserta (POST)
  const payload = {
    mes:   row.mes,
    tasks: row.tasks,
    done:  row.done,
    notes: row.notes || {}
  };

  // Intento PATCH (actualizar fila existente)
  const patch = await fetch(`${SB_URL}/rest/v1/mtto_meses?id=eq.${row.id}`, {
    method: 'PATCH',
    headers: { ...HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify(payload)
  });
  if (!patch.ok) throw new Error('Error guardando (PATCH): ' + await patch.text());
  const patched = await patch.json();

  // Si no actualizó nada (fila nueva), hace INSERT
  if (!patched || patched.length === 0) {
    const post = await fetch(`${SB_URL}/rest/v1/mtto_meses`, {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'return=representation' },
      body: JSON.stringify({ id: row.id, ...payload })
    });
    if (!post.ok) throw new Error('Error guardando (POST): ' + await post.text());
  }
}
async function sbDelete(id) {
  const r = await fetch(`${SB_URL}/rest/v1/mtto_meses?id=eq.${id}`, {
    method: 'DELETE', headers: HEADERS
  });
  if (!r.ok) throw new Error('Error eliminando');
}

// ══════════════════════════════════════════════════
//  PARSE EXCEL
// ══════════════════════════════════════════════════
function excelDate(v) {
  if (!v) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number') {
    const d = new Date((v - 25569) * 86400 * 1000);
    return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCFullYear()).slice(2)}`;
  }
  return String(v);
}
const SKIP_SECTIONS = ['RUTINA','LIMPIEZA','ORDENES DE TRABAJO','ÓRDENES DE TRABAJO'];
function detectCat(v) {
  const s = String(v||'').toUpperCase();
  if (SKIP_SECTIONS.some(x => s.includes(x))) return 'SKIP';
  if (s.includes('APOYO CR')) return 'Apoyo Crítico';
  if (s.includes('PREVENTIVO DE EQUIPOS') || s.includes('PREVENTIVO EQUIPOS (F')) return 'Equipos';
  if (s.includes('INSPECCIÓN') && s.includes('REA')) return 'Insp. Áreas';
  if (s.includes('CALIBRACIONES INTERNAS')) return 'Cal. Interna';
  if (s.includes('CALIBRACIONES EXTERNAS')) return 'Cal. Externa';
  return null;
}
function isHeaderRow(r) {
  return r.map(v => String(v||'').toUpperCase()).some(v => ['EQUIPO','NOMBRE DEL ÁREA','INTRUMENTO','INSTRUMENTO'].includes(v));
}
function parseFile(data) {
  const wb = XLSX.read(data, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const tasks = []; let cat = 'Equipos'; let id = 0; let mes = '';
  for (const row of rows) {
    const first = String(row[0]||'').trim();
    if (first.toUpperCase().includes('MES DE PROGRAMA')) mes = String(row[1]||row[2]||'').trim();
    const nc = detectCat(first);
    if (nc) { cat = nc; continue; }
    if (cat === 'SKIP') continue;
    if (isHeaderRow(row) || !first || first.length < 3) continue;
    if (['PROGRAMACIÓN','ELABORADO','APROBADO','TOTAL','NOMBRE','BUSSIE'].some(x => first.toUpperCase().includes(x))) continue;
    const resp = String(row[5]||'').trim();
    const activ = String(row[3]||'').trim();
    if (!resp || !activ || resp.length < 3) continue;
    tasks.push({ id: id++, cat, equipo: first, codigo: String(row[1]||'').trim(), activ, freq: String(row[4]||'').trim(), resp, fecha: excelDate(row[6]) });
  }
  return { tasks, mes };
}

// ══════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════
async function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const { tasks, mes } = parseFile(new Uint8Array(e.target.result));
      if (!tasks.length) { alert('No se encontraron actividades.'); return; }
      const id = Date.now();
      const row = { id, mes: mes || `Mes ${months.length + 1}`, tasks, done: {}, notes: {} };
      months.push(row);
      activeMonth = id;
      activeTech = [...new Set(tasks.map(t => t.resp))].sort()[0];
      setSyncing(true);
      await sbUpsert(row);
      setSyncing(false);
      render();
    } catch(err) { setSyncing(false, true); alert('Error: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  document.getElementById('fileInput').value = '';
}

async function toggle(taskId) {
  const m = months.find(m => m.id === activeMonth);
  if (!m) return;
  if (m.done[taskId]) delete m.done[taskId];
  else m.done[taskId] = true;
  render(); // optimistic
  setSyncing(true);
  try {
    await sbUpsert({ id: m.id, mes: m.mes, tasks: m.tasks, done: m.done, notes: m.notes || {} });
    setSyncing(false);
  } catch(e) { setSyncing(false, true); alert('Error al guardar check: ' + e.message); }
}

let activeNote = null; // taskId of currently open note panel

function toggleNote(taskId, e) {
  e.stopPropagation();
  activeNote = (activeNote === taskId) ? null : taskId;
  render();
  if (activeNote !== null) {
    setTimeout(() => {
      const ta = document.getElementById('note-ta-' + taskId);
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }, 30);
  }
}

async function saveNote(taskId) {
  const m = months.find(m => m.id === activeMonth);
  if (!m) return;
  const ta = document.getElementById('note-ta-' + taskId);
  if (!ta) return;
  const val = ta.value.trim();
  if (!m.notes) m.notes = {};
  if (val) m.notes[taskId] = val;
  else delete m.notes[taskId];
  activeNote = null;
  render();
  setSyncing(true);
  try {
    await sbUpsert({ id: m.id, mes: m.mes, tasks: m.tasks, done: m.done, notes: m.notes });
    setSyncing(false);
  } catch(e) { setSyncing(false, true); alert('Error al guardar nota: ' + e.message); }
}

async function deleteMonth() {
  const m = months.find(m => m.id === activeMonth);
  if (!m || !confirm(`¿Borrar el mes "${m.mes}"?`)) return;
  months = months.filter(mo => mo.id !== activeMonth);
  activeMonth = months.length ? months[months.length-1].id : null;
  activeTech = null;
  setSyncing(true);
  try { await sbDelete(m.id); setSyncing(false); } catch(e) { setSyncing(false, true); }
  render();
}

async function removeMonth(id, e) {
  e.stopPropagation();
  const m = months.find(m => m.id === id);
  if (!m || !confirm(`¿Eliminar el mes "${m.mes}"?`)) return;
  months = months.filter(m => m.id !== id);
  if (activeMonth === id) activeMonth = months.length ? months[months.length-1].id : null;
  activeTech = null;
  setSyncing(true);
  try { await sbDelete(id); setSyncing(false); } catch(e) { setSyncing(false, true); }
  render();
}

function setSyncing(on, error=false) {
  syncing = on; syncError = error;
  const dot = document.getElementById('syncDot');
  if (!dot) return;
  dot.className = 'sync-dot' + (on ? ' syncing' : '') + (error ? ' error' : '');
  dot.title = on ? 'Guardando…' : error ? 'Error al guardar' : 'Sincronizado ✓';
}

// ══════════════════════════════════════════════════
//  EXPORT
// ══════════════════════════════════════════════════
function exportReport() {
  const m = months.find(m => m.id === activeMonth);
  if (!m) return;
  const wb = XLSX.utils.book_new();
  const techs = [...new Set(m.tasks.map(t => t.resp))].sort();
  const sumRows = [['TÉCNICO','TOTAL','REALIZADOS','PENDIENTES','% CUMPLIMIENTO']];
  techs.forEach(resp => {
    const mine = m.tasks.filter(t => t.resp === resp);
    const h = mine.filter(t => m.done[t.id]).length;
    sumRows.push([resp, mine.length, h, mine.length-h, mine.length ? Math.round(h/mine.length*100)+'%' : '0%']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sumRows), 'Resumen');
  const detRows = [['TÉCNICO','CATEGORÍA','EQUIPO','CÓDIGO','ACTIVIDAD','FRECUENCIA','FECHA LÍMITE','ESTADO','NOTAS']];
  m.tasks.forEach(t => detRows.push([t.resp, t.cat, t.equipo, t.codigo, t.activ, t.freq, t.fecha, m.done[t.id]?'REALIZADO':'PENDIENTE', (m.notes||{})[t.id]||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detRows), 'Detalle');
  const pendRows = [['TÉCNICO','CATEGORÍA','EQUIPO','CÓDIGO','ACTIVIDAD','FRECUENCIA','FECHA LÍMITE','NOTAS']];
  m.tasks.filter(t => !m.done[t.id]).forEach(t => pendRows.push([t.resp, t.cat, t.equipo, t.codigo, t.activ, t.freq, t.fecha, (m.notes||{})[t.id]||'']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pendRows), 'Pendientes');
  XLSX.writeFile(wb, `Informe_Mtto_${m.mes.replace(/\s/g,'_')}.xlsx`);
}

// ══════════════════════════════════════════════════
function headerHtml(subtitle, monthTabsHtml) {
  return `<div class="header">
    ${monthTabsHtml ? `<div class="month-bar">${monthTabsHtml}</div>` : '<div class="month-bar"></div>'}
    <div class="header-right">
      <div id="syncDot" class="sync-dot" title="Sincronizado ✓"></div>
      <button class="btn-white" onclick="deleteMonth()">🗑 Borrar mes</button>
    </div>
  </div>`;
}

function render() {
  const root = document.getElementById('app');

  if (loading) {
    root.innerHTML = `
    <div class="header"></div>
    <div class="loading"><div class="loading-spin">⚙️</div><br>Cargando datos…</div>`;
    return;
  }

  if (!months.length) {
    root.innerHTML = `
    <div class="header"></div>
    <div class="upload-wrap">
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:48px">📊</div>
        <h2>Cargar primer mes</h2>
        <p>Sube el Excel de programación mensual.<br>Los datos quedan guardados en la nube para todos.</p>
        <br><button class="btn-blue">Seleccionar archivo</button>
      </div>
    </div>`;
    return;
  }

  const m = months.find(m => m.id === activeMonth) || months[0];
  activeMonth = m.id;
  const techs = [...new Set(m.tasks.map(t => t.resp))].sort();
  if (!activeTech || !techs.includes(activeTech)) activeTech = techs[0];

  const totalAll = m.tasks.length;
  const doneAll  = m.tasks.filter(t => m.done[t.id]).length;
  const pctAll   = totalAll ? Math.round(doneAll/totalAll*100) : 0;
  const mine     = m.tasks.filter(t => t.resp === activeTech);
  const doneMine = mine.filter(t => m.done[t.id]).length;
  const pendMine = mine.length - doneMine;
  const pctMine  = mine.length ? Math.round(doneMine/mine.length*100) : 0;

  let html = headerHtml(`${months.length} mes${months.length>1?'es':''} cargado${months.length>1?'s':''}`, `
    ${months.map(mo => {
      const tot = mo.tasks.length;
      const don = mo.tasks.filter(t => mo.done[t.id]).length;
      const pct = tot ? Math.round(don/tot*100) : 0;
      return `<div class="month-tab ${mo.id===activeMonth?'active':''}" onclick="activeMonth=${mo.id};activeTech=null;render()">
        ${mo.mes.toUpperCase()}
        <span class="month-pct">${pct}%</span>
        <span class="month-close" onclick="removeMonth(${mo.id},event)">×</span>
      </div>`;
    }).join('')}
    <div class="month-add" title="Agregar mes" onclick="document.getElementById('fileInput').click()">＋</div>
  `);

  html += `<div class="global-bar">
    <div class="gs"><div class="gs-n" style="color:#0D2F5C">${totalAll}</div><div class="gs-l">Total</div></div>
    <div class="gs"><div class="gs-n" style="color:#16a34a">${doneAll}</div><div class="gs-l">Realizados</div></div>
    <div class="gs"><div class="gs-n" style="color:#ca8a04">${totalAll-doneAll}</div><div class="gs-l">Pendientes</div></div>
    <div class="prog-wrap">
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:11px;color:#64748b">Avance del mes</span>
        <span style="font-size:13px;font-weight:700;color:${pctColor(pctAll)}">${pctAll}%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pctAll}%;background:${pctColor(pctAll)}"></div></div>
    </div>
  </div>

  <div class="tech-nav">
    ${techs.map(resp => {
      const mi = m.tasks.filter(t => t.resp === resp);
      const di = mi.filter(t => m.done[t.id]).length;
      const pi = mi.length - di;
      return `<div class="tech-tab ${resp===activeTech?'active':''}" onclick="activeTech='${resp}';render()">
        ${resp}
        ${di ? `<span class="badge badge-ok">${di}</span>` : ''}
        ${pi ? `<span class="badge badge-pend">${pi}</span>` : ''}
      </div>`;
    }).join('')}
  </div>

  <div class="tech-panel">
    <div class="tech-header">
      <div class="th-name">${activeTech}</div>
      <div class="th-stat"><div class="th-n" style="color:${pctColor(pctMine)}">${pctMine}%</div><div class="th-l">cumplimiento</div></div>
      <div class="th-stat"><div class="th-n" style="color:#16a34a">${doneMine}</div><div class="th-l">realizados</div></div>
      <div class="th-stat"><div class="th-n" style="color:#ca8a04">${pendMine}</div><div class="th-l">pendientes</div></div>
      <div>
        <div class="th-bar"><div class="th-fill" style="width:${pctMine}%;background:${pctColor(pctMine)}"></div></div>
        <div style="font-size:10px;color:#94a3b8;margin-top:3px">${mine.length} actividades</div>
      </div>
    </div>`;

  const pendList = mine.filter(t => !m.done[t.id]);
  const hechos   = mine.filter(t =>  m.done[t.id]);

  if (pendList.length) {
    html += '<div class="section-label">⏳ Pendientes (' + pendList.length + ')</div>';
    pendList.forEach(t => {
      const note = (m.notes||{})[t.id] || '';
      const open = activeNote === t.id;
      const notePreview = (note && !open) ? '<div class="task-note-preview">📝 ' + note + '</div>' : '';
      const noteClass   = note ? 'note-btn has-note' : 'note-btn';
      const noteTitle   = note ? 'Ver/editar nota' : 'Agregar nota';
      const notePanel   = open
        ? '<div class="note-panel"><textarea id="note-ta-' + t.id + '" placeholder="Escribe una nota…">' + note + '</textarea><button class="note-save-btn" onclick="saveNote(' + t.id + ')">Guardar</button></div>'
        : '';
      html += '<div class="task-card">'
        + '<div class="task-row" onclick="toggle(' + t.id + ')">'
        + '<div class="check"></div>'
        + '<div class="task-info">'
        + '<div class="task-name">' + t.equipo + '</div>'
        + '<div class="task-sub"><span class="task-code">' + t.codigo + '</span>&nbsp;' + t.activ + '&nbsp;·&nbsp;' + t.freq + '</div>'
        + notePreview
        + '</div>'
        + '<div class="task-date">📅 ' + t.fecha + '</div>'
        + '<button class="' + noteClass + '" onclick="toggleNote(' + t.id + ', event)" title="' + noteTitle + '">📝</button>'
        + '</div>'
        + notePanel
        + '</div>';
    });
  }
  if (hechos.length) {
    html += '<div class="section-label">✅ Realizados (' + hechos.length + ')</div>';
    hechos.forEach(t => {
      const note = (m.notes||{})[t.id] || '';
      const open = activeNote === t.id;
      const notePreview = (note && !open) ? '<div class="task-note-preview">📝 ' + note + '</div>' : '';
      const noteClass   = note ? 'note-btn has-note' : 'note-btn';
      const noteTitle   = note ? 'Ver/editar nota' : 'Agregar nota';
      const notePanel   = open
        ? '<div class="note-panel"><textarea id="note-ta-' + t.id + '" placeholder="Escribe una nota…">' + note + '</textarea><button class="note-save-btn" onclick="saveNote(' + t.id + ')">Guardar</button></div>'
        : '';
      html += '<div class="task-card done">'
        + '<div class="task-row" onclick="toggle(' + t.id + ')">'
        + '<div class="check on">✓</div>'
        + '<div class="task-info">'
        + '<div class="task-name">' + t.equipo + '</div>'
        + '<div class="task-sub"><span class="task-code">' + t.codigo + '</span>&nbsp;' + t.activ + '&nbsp;·&nbsp;' + t.freq + '</div>'
        + notePreview
        + '</div>'
        + '<div class="task-date">📅 ' + t.fecha + '</div>'
        + '<button class="' + noteClass + '" onclick="toggleNote(' + t.id + ', event)" title="' + noteTitle + '">📝</button>'
        + '</div>'
        + notePanel
        + '</div>';
    });
  }

  html += `</div>
  <div class="footer">
    <span class="footer-info">${m.mes.toUpperCase()} · ${activeTech} · ${doneMine} realizados · ${pendMine} pendientes</span>
    <button class="btn-green" style="margin-left:auto" onclick="exportReport()">⬇ Exportar informe</button>
    <button class="btn-blue" id="pptxBtn" onclick="generarInformePPTX()">📊 Informe PPTX</button>
  </div>`;

  root.innerHTML = html;
}

// ══════════════════════════════════════════════════
//  INFORME PPTX (estilo Sanfer, mismos gráficos/tablas)
// ══════════════════════════════════════════════════
const RPT = {
  RED_DARK: 'A41E20', RED_MAIN: 'DB0000', NAVY_TEXT: '2B2B2B',
  GREY_TEXT: '64748B', GREEN: '16A34A', AMBER: 'CA8A04', LIGHT_BG: 'F5F5F5'
};

function normTechKey(s) {
  return String(s || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function computeReportData() {
  // Mapa clave-normalizada -> nombre a mostrar (prefiere la variante con mayúsculas/minúsculas mixtas)
  const displayName = {};
  months.forEach(m => m.tasks.forEach(t => {
    const key = normTechKey(t.resp);
    if (!key) return;
    const raw = String(t.resp).trim();
    const current = displayName[key];
    if (!current) { displayName[key] = raw; }
    else if (current === current.toUpperCase() && raw !== raw.toUpperCase()) { displayName[key] = raw; }
  }));
  const techs = Object.keys(displayName).sort((a,b) => displayName[a].localeCompare(displayName[b]));

  const perMes = months.map(m => {
    const total = m.tasks.length;
    const cerrados = m.tasks.filter(t => m.done[t.id]).length;
    const abiertos = total - cerrados;
    const pct = total ? Math.round(cerrados / total * 100) : 0;
    const porTecnico = {};
    techs.forEach(te => porTecnico[te] = { total: 0, cerrados: 0, abiertos: 0 });
    m.tasks.forEach(t => {
      const key = normTechKey(t.resp);
      if (!key || !porTecnico[key]) return;
      porTecnico[key].total++;
      if (m.done[t.id]) porTecnico[key].cerrados++;
      else porTecnico[key].abiertos++;
    });
    return { mes: m.mes, total, cerrados, abiertos, pct, porTecnico };
  });

  const totTecnico = {};
  techs.forEach(te => totTecnico[te] = { total: 0, cerrados: 0, abiertos: 0 });
  perMes.forEach(pm => techs.forEach(te => {
    totTecnico[te].total     += pm.porTecnico[te].total;
    totTecnico[te].cerrados  += pm.porTecnico[te].cerrados;
    totTecnico[te].abiertos  += pm.porTecnico[te].abiertos;
  }));

  const granTotal = perMes.reduce((a,p)=>({
    total: a.total+p.total, cerrados: a.cerrados+p.cerrados, abiertos: a.abiertos+p.abiertos
  }), {total:0, cerrados:0, abiertos:0});

  return { techs, displayName, perMes, totTecnico, granTotal };
}

function addFooterRpt(slide, pres, label) {
  slide.addText('Mantenimientos Preventivos · Bussié', {
    x: 0.5, y: 7.08, w: 6, h: 0.3, fontSize: 9, color: RPT.GREY_TEXT, fontFace: 'Arial', margin: 0
  });
  slide.addText(label, {
    x: 9.83, y: 7.08, w: 3, h: 0.3, fontSize: 9, color: RPT.GREY_TEXT, fontFace: 'Arial', align: 'right', margin: 0
  });
}
function addTitleRpt(slide, title, subtitle) {
  slide.addText(title, { x: 0.6, y: 0.45, w: 12.1, h: 0.65, fontSize: 30, bold: true, color: RPT.RED_DARK, fontFace: 'Cambria', margin: 0 });
  if (subtitle) slide.addText(subtitle, { x: 0.6, y: 1.05, w: 12.1, h: 0.35, fontSize: 13, color: RPT.GREY_TEXT, fontFace: 'Arial', margin: 0 });
}

// pptxgenjs (v3.12) a veces reutiliza el mismo ID de forma para una tabla que
// para un texto ya existente en la misma diapositiva (bug de la librería),
// lo que hace que PowerPoint tenga que "reparar y quitar" contenido al abrir.
// Esta función renumera los IDs de cada diapositiva, en orden de aparición,
// garantizando que sean únicos, sin tocar nada más del archivo.
async function corregirIdsYDescargar(pres, fileName) {
  const blob = await pres.write({ outputType: 'blob' });
  const zip = await JSZip.loadAsync(blob);
  const slideFiles = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f));
  for (const f of slideFiles) {
    const xml = await zip.file(f).async('string');
    let counter = 0;
    const fixed = xml.replace(/(<p:cNvPr\s+id=")(\d+)(")/g, (m, pre, oldId, post) => {
      counter++;
      return pre + counter + post;
    });
    zip.file(f, fixed);
  }
  const fixedBlob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(fixedBlob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function generarInformePPTX() {
  const btn = document.getElementById('pptxBtn');
  const original = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generando…'; }
  try {
    const { techs, displayName, perMes, totTecnico, granTotal } = computeReportData();
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_WIDE';
    const pctTot = granTotal.total ? Math.round(granTotal.cerrados/granTotal.total*100) : 0;
    const rango = perMes.length ? `${perMes[0].mes} — ${perMes[perMes.length-1].mes}` : '';

    // Slide 1 — Portada
    let s1 = pres.addSlide();
    s1.background = { path: 'assets/sanfer_cover.png' };
    s1.addText('MANTENIMIENTOS\nPREVENTIVOS', { x:7.3, y:2.35, w:5.4, h:1.9, fontSize:32, bold:true, color:RPT.RED_DARK, fontFace:'Cambria', lineSpacing:40, margin:0 });
    s1.addText(`Seguimiento ${rango}`, { x:7.35, y:4.25, w:5.4, h:0.5, fontSize:16, color:RPT.NAVY_TEXT, fontFace:'Arial', margin:0 });

    // Slide 2 — Resumen general por mes
    let s2 = pres.addSlide();
    s2.background = { color: 'FFFFFF' };
    addTitleRpt(s2, 'Resumen general por mes', `Total de mantenimientos preventivos, cerrados y abiertos — ${rango}`);
    const stats = [
      { n: granTotal.total, l: 'TOTAL', c: RPT.RED_DARK },
      { n: granTotal.cerrados, l: 'CERRADOS', c: RPT.GREEN },
      { n: granTotal.abiertos, l: 'ABIERTOS', c: RPT.AMBER },
      { n: pctTot + '%', l: '% CUMPLIMIENTO', c: RPT.RED_DARK },
    ];
    const statW = 2.85, gap = 0.25, startX = 0.6, statY = 1.65;
    stats.forEach((s,i) => {
      const x = startX + i*(statW+gap);
      s2.addShape(pres.ShapeType.roundRect, { x, y:statY, w:statW, h:1.15, rectRadius:0.08, fill:{color:RPT.LIGHT_BG}, line:{type:'none'} });
      s2.addText(String(s.n), { x, y:statY+0.12, w:statW, h:0.6, fontSize:30, bold:true, color:s.c, align:'center', fontFace:'Cambria', margin:0 });
      s2.addText(s.l, { x, y:statY+0.75, w:statW, h:0.3, fontSize:10, color:RPT.GREY_TEXT, align:'center', fontFace:'Arial', margin:0 });
    });

    function buildResumenMesRows(fontSize) {
      const headerRow = ['MES','TOTAL','CERRADOS','ABIERTOS','% CUMPLIMIENTO'].map(t => ({ text:t, options:{ bold:true, color:'FFFFFF', fill:{color:RPT.RED_DARK}, fontFace:'Arial', fontSize, align:'center', valign:'middle' } }));
      const bodyRows = perMes.map((r,idx) => {
        const fill = idx%2===0 ? 'FFFFFF' : RPT.LIGHT_BG;
        return [
          { text: r.mes, options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'left', valign:'middle', bold:true } },
          { text: String(r.total), options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'center', valign:'middle' } },
          { text: String(r.cerrados), options:{ fontFace:'Arial', fontSize, color:RPT.GREEN, fill:{color:fill}, align:'center', valign:'middle', bold:true } },
          { text: String(r.abiertos), options:{ fontFace:'Arial', fontSize, color:RPT.AMBER, fill:{color:fill}, align:'center', valign:'middle', bold:true } },
          { text: r.pct+'%', options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'center', valign:'middle' } },
        ];
      });
      const totalRow = ['TOTAL', granTotal.total, granTotal.cerrados, granTotal.abiertos, pctTot+'%'].map(v => ({ text:String(v), options:{ bold:true, fontFace:'Arial', fontSize, color:'FFFFFF', fill:{color:RPT.NAVY_TEXT}, align:'center', valign:'middle' } }));
      totalRow[0].options.align = 'left';
      return { headerRow, bodyRows, totalRow };
    }

    const tableY2 = 3.15, bottomLimit = 7.0, availH2 = bottomLimit - tableY2;
    const rowsNeeded2 = perMes.length + 2;
    const rowH2_1col = availH2 / rowsNeeded2;
    if (rowH2_1col >= 0.30) {
      const { headerRow, bodyRows, totalRow } = buildResumenMesRows(12);
      s2.addTable([headerRow, ...bodyRows, totalRow], { x:0.6, y:tableY2, w:12.1, colW:[3.0,2.275,2.275,2.275,2.275], rowH:rowH2_1col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
    } else {
      const { headerRow, bodyRows, totalRow } = buildResumenMesRows(8);
      const half = Math.ceil(bodyRows.length / 2);
      const left = bodyRows.slice(0, half), right = bodyRows.slice(half);
      const rowH2col = Math.max(0.19, availH2 / (Math.max(left.length, right.length) + 2));
      const colWHalf = [1.6, 1.0, 1.05, 1.05, 1.05];
      s2.addTable([headerRow, ...left], { x:0.6, y:tableY2, w:5.75, colW:colWHalf, rowH:rowH2col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
      s2.addTable([headerRow, ...right, totalRow], { x:6.65, y:tableY2, w:5.75, colW:colWHalf, rowH:rowH2col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
    }
    addFooterRpt(s2, pres, '2');

    // Slide 3 — Total por técnico
    let s3 = pres.addSlide();
    s3.background = { color: 'FFFFFF' };
    addTitleRpt(s3, 'Total por técnico', `Acumulado ${rango}, ordenado por carga total`);
    const techsSorted = techs.slice().sort((a,b) => totTecnico[b].total - totTecnico[a].total);

    function buildTecnicoRows(fontSize) {
      const headerRow = ['TÉCNICO','TOTAL','CERRADOS','ABIERTOS','% CUMPLIMIENTO'].map(t => ({ text:t, options:{ bold:true, color:'FFFFFF', fill:{color:RPT.RED_DARK}, fontFace:'Arial', fontSize, align:'center', valign:'middle' } }));
      const bodyRows = techsSorted.map((te,idx) => {
        const d = totTecnico[te];
        const pct = d.total ? Math.round(d.cerrados/d.total*100) : 0;
        const fill = idx%2===0 ? 'FFFFFF' : RPT.LIGHT_BG;
        return [
          { text: displayName[te], options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'left', valign:'middle', bold:true } },
          { text: String(d.total), options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'center', valign:'middle' } },
          { text: String(d.cerrados), options:{ fontFace:'Arial', fontSize, color:RPT.GREEN, fill:{color:fill}, align:'center', valign:'middle', bold:true } },
          { text: String(d.abiertos), options:{ fontFace:'Arial', fontSize, color:RPT.AMBER, fill:{color:fill}, align:'center', valign:'middle', bold:true } },
          { text: pct+'%', options:{ fontFace:'Arial', fontSize, color:RPT.NAVY_TEXT, fill:{color:fill}, align:'center', valign:'middle' } },
        ];
      });
      const totalRow = ['TOTAL', granTotal.total, granTotal.cerrados, granTotal.abiertos, pctTot+'%'].map(v => ({ text:String(v), options:{ bold:true, fontFace:'Arial', fontSize, color:'FFFFFF', fill:{color:RPT.NAVY_TEXT}, align:'center', valign:'middle' } }));
      totalRow[0].options.align = 'left';
      return { headerRow, bodyRows, totalRow };
    }

    const tableY3 = 1.55, availH3 = bottomLimit - tableY3;
    const rowsNeeded3 = techsSorted.length + 2;
    const rowH3_1col = availH3 / rowsNeeded3;
    if (rowH3_1col >= 0.30) {
      const { headerRow, bodyRows, totalRow } = buildTecnicoRows(11.5);
      s3.addTable([headerRow, ...bodyRows, totalRow], { x:0.6, y:tableY3, w:12.1, colW:[3.4,2.175,2.175,2.175,2.175], rowH:rowH3_1col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
    } else {
      const { headerRow, bodyRows, totalRow } = buildTecnicoRows(9);
      const half = Math.ceil(bodyRows.length / 2);
      const left = bodyRows.slice(0, half), right = bodyRows.slice(half);
      const rowH3col = Math.max(0.20, availH3 / (Math.max(left.length, right.length) + 2));
      const colWHalf = [1.7, 1.0, 1.0, 1.0, 1.05];
      s3.addTable([headerRow, ...left], { x:0.6, y:tableY3, w:5.75, colW:colWHalf, rowH:rowH3col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
      s3.addTable([headerRow, ...right, totalRow], { x:6.65, y:tableY3, w:5.75, colW:colWHalf, rowH:rowH3col, border:{type:'solid', color:'E2E8F0', pt:0.75}, autoPage:false });
    }
    addFooterRpt(s3, pres, '3');

    // Slides 4+ — Gráfico horizontal por mes
    let page = 4;
    for (const pm of perMes) {
      let s = pres.addSlide();
      s.background = { color: 'FFFFFF' };
      addTitleRpt(s, `${pm.mes} — Mantenimientos por técnico`, `Cerrados vs. abiertos · ${pm.total} mantenimientos totales · ${pm.pct}% cumplimiento`);
      const idxConActividad = [];
      techsSorted.forEach((te, i) => {
        if (pm.porTecnico[te].cerrados > 0 || pm.porTecnico[te].abiertos > 0) idxConActividad.push(i);
      });
      const labelsDisplay = idxConActividad.map(i => displayName[techsSorted[i]]);
      const cerradosVals = idxConActividad.map(i => pm.porTecnico[techsSorted[i]].cerrados);
      const abiertosVals = idxConActividad.map(i => pm.porTecnico[techsSorted[i]].abiertos);
      if (!labelsDisplay.length) {
        s.addText('No hay mantenimientos cerrados ni abiertos registrados para este mes.', {
          x: 0.6, y: 3.2, w: 12.1, h: 0.6, fontSize: 14, color: RPT.GREY_TEXT, align: 'center', fontFace: 'Arial', italic: true
        });
      } else {
      s.addChart(pres.ChartType.bar, [
        { name: 'Cerrados', labels: labelsDisplay, values: cerradosVals },
        { name: 'Abiertos', labels: labelsDisplay, values: abiertosVals }
      ], {
        x:0.6, y:1.5, w:12.1, h:5.5, barDir:'bar', barGrouping:'clustered',
        showTitle:false, showLegend:true, legendPos:'b', legendFontSize:11, legendFontFace:'Arial',
        chartColors:[RPT.GREEN, RPT.AMBER], showValue:true, dataLabelPosition:'outEnd',
        dataLabelFontSize:9, dataLabelColor:RPT.NAVY_TEXT, dataLabelFontFace:'Arial',
        catAxisLabelFontSize:11, catAxisLabelFontFace:'Arial', catAxisLabelColor:RPT.NAVY_TEXT,
        valAxisLabelFontSize:10, valAxisLabelFontFace:'Arial', valAxisLabelColor:RPT.GREY_TEXT,
        valGridLine:{color:'E2E8F0', size:1}, catGridLine:{style:'none'},
        valAxisTitle:'Cantidad de mantenimientos', showValAxisTitle:true, valAxisTitleFontSize:10, valAxisTitleColor:RPT.GREY_TEXT
      });
      }
      addFooterRpt(s, pres, String(page));
      page++;
    }

    const fecha = new Date().toISOString().slice(0,10);
    await corregirIdsYDescargar(pres, `Mantenimientos_Preventivos_${fecha}.pptx`);
  } catch (e) {
    alert('No se pudo generar el informe: ' + e.message);
    console.error(e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = original; }
  }
}

(async () => {
  render(); // muestra loading
  try {
    const rows = await sbLoad();
    months = rows.map(r => ({ ...r, notes: r.notes || {} }));
    activeMonth = rows.length ? rows[rows.length-1].id : null;
    activeTech  = null;
  } catch(e) {
    alert('No se pudo conectar a Supabase. Verifica tu conexión.');
  }
  loading = false;
  render();
})();
</script>
